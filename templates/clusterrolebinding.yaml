apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "ecr-login-renew.roleBinding" . }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "ecr-login-renew.role" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "ecr-login-renew.serviceAccount" . }}
    namespace: {{ include "ecr-login-renew.namespace" . }}
    