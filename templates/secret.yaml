apiVersion: v1
kind: Secret
metadata:
  name: {{ include "ecr-login-renew.secret" . }}
  namespace: {{ include "ecr-login-renew.namespace" . }}
  labels:
{{ include "ecr-login-renew.labels" . | indent 4 }}
type: Opaque
stringData:
  AWS_ACCESS_KEY_ID: {{ .Values.ecr.accessKeyId }}
  AWS_SECRET_ACCESS_KEY: {{ .Values.ecr.secretAccessKey }}
